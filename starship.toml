add_newline = false
command_timeout = 500

format = """
$username$hostname$directory$git_branch$git_status$jobs$status$cmd_duration
$character"""

[username]
show_always = true
style_user = "bold green"
style_root = "bold red"
format = "[$user]($style)@"

[hostname]
ssh_only = false
style = "bold green"
format = "[$hostname]($style) "

[directory]
style = "bold cyan"
truncation_length = 3
truncation_symbol = ".../"
read_only = " [ro]"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = "git:"
style = "bold purple"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold yellow"
format = '([\[$all_status$ahead_behind\]]($style) )'
ahead = "^"
behind = "v"
diverged = "^v"
conflicted = "="
untracked = "?"
stashed = "$"
modified = "!"
staged = "+"
renamed = "r"
deleted = "x"

[jobs]
symbol = "&"
number_threshold = 1
format = "[$symbol$number]($style) "

[status]
disabled = false
symbol = "x"
format = "[$symbol$status]($style) "

[cmd_duration]
min_time = 2000
format = "[took $duration]($style) "
style = "yellow"

[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"
